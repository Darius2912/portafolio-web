<style>

:root{
    --bg-deep:#020B2D;
    --bg-mid:#06173f;
    --accent:#38BDF8;
    --accent-dim:#1e4f72;
    --text-soft:#cbd5e1;
}

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    background:radial-gradient(circle at 50% 20%, var(--bg-mid) 0%, var(--bg-deep) 70%);
    font-family:Arial, Helvetica, sans-serif;
    color:white;
    height:100%;
    overflow-x:hidden;
}

.network-bg{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    z-index:0;
    opacity:0.5;
}

nav{
    position:relative;
    z-index:2;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:28px 50px;
    flex-wrap:wrap;
    gap:16px;
}

.nav-logo{
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:bold;
    font-size:20px;
    letter-spacing:1px;
    color:white;
}

.nav-logo .brackets{
    color:var(--accent);
    font-size:22px;
}

.nav-links{
    display:flex;
    gap:30px;
    flex-wrap:wrap;
}

.nav-links a{
    color:var(--text-soft);
    text-decoration:none;
    font-size:15px;
    transition:color 0.2s ease;
    letter-spacing:0.3px;
}

.nav-links a:hover,
.nav-links a:focus-visible{
    color:var(--accent);
}

main{
    position:relative;
    z-index:2;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    padding:60px 20px 100px;
    max-width:800px;
    margin:0 auto;
}

.logo-mark{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:18px;
    margin-bottom:10px;
}

.hexagon{
    width:74px;
    height:84px;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
}

.hexagon svg{
    width:100%;
    height:100%;
}

.dc-text{
    font-size:64px;
    font-weight:900;
    color:var(--accent);
    letter-spacing:2px;
    line-height:1;
}

h1{
    font-size:54px;
    margin:30px 0 0 0;
    letter-spacing:1px;
    font-weight:800;
}

h2{
    font-size:22px;
    color:var(--accent);
    margin-top:16px;
    font-weight:400;
    letter-spacing:0.5px;
}

.line{
    width:180px;
    height:3px;
    background:var(--accent);
    margin:32px auto;
    border-radius:20px;
}

p.subtitle{
    margin:0 0 36px 0;
    color:var(--text-soft);
    font-size:17px;
}

.tech-row{
    display:flex;
    justify-content:center;
    gap:22px;
    flex-wrap:wrap;
    margin-bottom:40px;
}

.tech-row .icon{
    width:46px;
    height:46px;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(56,189,248,0.08);
    border:1px solid var(--accent-dim);
    transition:transform 0.2s ease, border-color 0.2s ease;
}

.tech-row .icon:hover{
    transform:translateY(-4px);
    border-color:var(--accent);
}

.tech-row .icon svg{
    width:24px;
    height:24px;
}

.cta{
    color:var(--accent);
    text-decoration:none;
    font-size:16px;
    border-bottom:1px solid transparent;
    transition:border-color 0.2s ease;
}

.cta:hover,
.cta:focus-visible{
    border-color:var(--accent);
}

footer{
    position:relative;
    z-index:2;
    text-align:center;
    padding:20px;
    color:#5b7396;
    font-size:13px;
}

@media (max-width:600px){
    nav{
        flex-direction:column;
        align-items:flex-start;
    }
    .nav-links{
        gap:18px;
        font-size:14px;
    }
    h1{
        font-size:36px;
    }
    .dc-text{
        font-size:46px;
    }
    .hexagon{
        width:54px;
        height:62px;
    }
}

@media (prefers-reduced-motion: reduce){
    .network-bg circle, .network-bg line{
        animation:none !important;
    }
}

</style>
</head>

<script>
(function(){
    const svg = document.getElementById('networkBg');
    const ns = 'http://www.w3.org/2000/svg';
    const W = window.innerWidth;
    const H = window.innerHeight;
    svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
    svg.setAttribute('preserveAspectRatio', 'none');

    const count = Math.max(28, Math.floor((W * H) / 28000));
    const points = [];
    for (let i = 0; i < count; i++) {
        points.push({
            x: Math.random() * W,
            y: Math.random() * H,
            vx: (Math.random() - 0.5) * 0.15,
            vy: (Math.random() - 0.5) * 0.15
        });
    }

    const maxDist = Math.max(W, H) / 6;
    const lineEls = [];
    const dotEls = [];

    for (let i = 0; i < points.length; i++) {
        for (let j = i + 1; j < points.length; j++) {
            const line = document.createElementNS(ns, 'line');
            line.setAttribute('stroke', '#38BDF8');
            line.setAttribute('stroke-width', '0.6');
            svg.appendChild(line);
            lineEls.push({ line: line, a: i, b: j });
        }
    }

    for (let i = 0; i < points.length; i++) {
        const c = document.createElementNS(ns, 'circle');
        c.setAttribute('r', '2');
        c.setAttribute('fill', '#ffffff');
        svg.appendChild(c);
        dotEls.push(c);
    }

    function dist(p1, p2) {
        return Math.hypot(p1.x - p2.x, p1.y - p2.y);
    }

    function tick() {
        for (const p of points) {
            p.x += p.vx;
            p.y += p.vy;
            if (p.x < 0 || p.x > W) p.vx *= -1;
            if (p.y < 0 || p.y > H) p.vy *= -1;
        }

        for (const item of lineEls) {
            const p1 = points[item.a];
            const p2 = points[item.b];
            const d = dist(p1, p2);
            if (d < maxDist) {
                item.line.setAttribute('x1', p1.x);
                item.line.setAttribute('y1', p1.y);
                item.line.setAttribute('x2', p2.x);
                item.line.setAttribute('y2', p2.y);
                item.line.setAttribute('opacity', Math.max(0, 1 - d / maxDist) * 0.4);
            } else {
                item.line.setAttribute('opacity', 0);
            }
        }

        for (let i = 0; i < points.length; i++) {
            dotEls[i].setAttribute('cx', points[i].x);
            dotEls[i].setAttribute('cy', points[i].y);
        }

        requestAnimationFrame(tick);
    }

    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (!reduceMotion) {
        tick();
    } else {
        for (const item of lineEls) {
            const p1 = points[item.a];
            const p2 = points[item.b];
            item.line.setAttribute('x1', p1.x);
            item.line.setAttribute('y1', p1.y);
            item.line.setAttribute('x2', p2.x);
            item.line.setAttribute('y2', p2.y);
            item.line.setAttribute('opacity', 0.15);
        }
        for (let i = 0; i < points.length; i++) {
            dotEls[i].setAttribute('cx', points[i].x);
            dotEls[i].setAttribute('cy', points[i].y);
        }
    }
})();
</script>
